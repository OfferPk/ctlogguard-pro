<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchCt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060813"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchCt)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    Certificate Transparency Architecture: Log Disqualification Outages vs 3-Log Resilience
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#140e18" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Single / Disqualified SCT &amp; No Monitoring
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#080b1a" stroke="#212a52"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Only 1-2 SCTs &bull; Disqualified Log &bull; No CAA Record</text>
  <text x="70" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Browser enforces Chrome/Apple CT rules; zero rogue cert alerts</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">OUTAGES &amp; ATTACK VECTORS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Browser root program disqualifies CT Log #1</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Chrome/Safari hard-block: ERR_CERTIFICATE_TRANSPARENCY_REQUIRED!</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Rogue CA issues unauthorized wildcard (*.company.com)</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Security team has zero CT monitoring; breach lasts for weeks</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">FATAL BROWSER LOCKOUT &amp; ROGUE SPOOFING BREACHES</text>

  <!-- Right: Hardened Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#091826" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: CTLogGuard Pro 3-Log Resilient Guard
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#080b1a" stroke="#212a52"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">3 Qualified SCTs &bull; Diverse Operators &bull; CAA issuewild ";"</text>
  <text x="560" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Redundant log resilience + real-time WebSocket CT log monitor</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ZERO-TRUST SECURITY GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 3 SCTs from Google, Cloudflare, DigiCert absorb log retirement</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 100% Chrome &amp; Apple CT qualification; zero browser outages</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; DNS CAA issuewild ";" actively rejects rogue wildcard creation</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; CT stream ingests pre-certificates in seconds; alerts SOC immediately</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">100% SERVICE AVAILABILITY &amp; BULLETPROOF CT COMPLIANCE</text>
</svg>
