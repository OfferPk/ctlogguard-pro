  <rect x="30" y="104" width="555" height="360" rx="10" fill="#131936" stroke="#212a52" stroke-width="1.5"/>
  <text x="50" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. Certificate &amp; Signed Certificate Timestamp (SCT) Parameters</text>

  <rect x="50" y="154" width="515" height="85" rx="6" fill="#080b1a" stroke="#212a52"/>
  <text x="64" y="176" fill="#38bdf8" font-family="monospace" font-size="11">{"domain": "api.apexfinbank.com", "validityPeriodDays": 365, "scts": [</text>
  <text x="64" y="196" fill="#34d399" font-family="monospace" font-size="11"> {"logName": "Google Argon 2026", "operator": "Google", "status": "usable"...},</text>
  <text x="64" y="216" fill="#a855f7" font-family="monospace" font-size="11"> {"logName": "Cloudflare Nimbus", "operator": "Cloudflare", "status": "usable"...}]}</text>

