  <rect x="635" y="238" width="515" height="32" rx="4" fill="#080b1a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="258" fill="#34d399" font-family="monospace" font-size="11">[PASS] SCT Count Compliance: 3 valid SCTs meet requirement (3 req).</text>

  <rect x="635" y="278" width="515" height="32" rx="4" fill="#080b1a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="298" fill="#34d399" font-family="monospace" font-size="11">[PASS] Log Operator Diversity: 3 diverse operators (Google: Yes).</text>

  <rect x="635" y="318" width="515" height="32" rx="4" fill="#080b1a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="338" fill="#34d399" font-family="monospace" font-size="11">[PASS] CT Log Qualification Status: All logs qualified and usable.</text>

  <rect x="635" y="358" width="515" height="32" rx="4" fill="#080b1a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="378" fill="#34d399" font-family="monospace" font-size="11">[PASS] DNS CAA Policy Record: CAA restricts issuance to digicert.com.</text>

  <rect x="635" y="398" width="515" height="32" rx="4" fill="#080b1a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="418" fill="#34d399" font-family="monospace" font-size="11">[PASS] Real-Time CT Log Monitoring: Active CT stream ingestion armed.</text>

  <!-- Bottom: Multi-Gateway TLS Synthesizer -->
  <rect x="30" y="484" width="1140" height="190" rx="10" fill="#131936" stroke="#212a52" stroke-width="1.5"/>
  <text x="50" y="514" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">3. Multi-Gateway Zero-Downtime Synthesizer (NGINX, Envoy, Go Gin, Python Monitor)</text>

  <rect x="50" y="528" width="1100" height="130" rx="6" fill="#080b1a" stroke="#212a52"/>
  <text x="66" y="552" fill="#06b6d4" font-family="monospace" font-size="12"># NGINX / OpenResty Hardened Certificate Transparency Configuration</text>
  <text x="66" y="572" fill="#cbd5e1" font-family="monospace" font-size="12">ssl_ct on;  ssl_ct_static_scts /etc/ssl/scts/api.apexfinbank.com;</text>
  <text x="66" y="592" fill="#34d399" font-family="monospace" font-size="12"># DNS CAA: 0 issue "digicert.com";  0 issuewild ";";  0 iodef "mailto:security@apexfinbank.com";</text>
  <text x="66" y="612" fill="#94a3b8" font-family="monospace" font-size="12"># Redundant 3-log SCT delivery prevents ERR_CERTIFICATE_TRANSPARENCY_REQUIRED outages</text>
</svg>
