  </defs>

  <rect width="1200" height="700" fill="url(#bgCt)"/>

  <!-- Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#131936" stroke="#212a52" stroke-width="1.5"/>
  <rect x="46" y="38" width="34" height="32" rx="6" fill="url(#gradLogoCt)"/>
  <text x="63" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle">CT</text>
  <text x="92" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">CTLogGuard Pro</text>
  <text x="250" y="57" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Certificate Transparency (RFC 6962 / 9162) &bull; SCT Auditor &amp; Rogue Cert Monitor</text>

  <rect x="880" y="40" width="135" height="26" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="947" y="57" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Chrome &amp; Apple CT</text>
  <rect x="1025" y="40" width="130" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="1090" y="57" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3-Log Resilient</text>

