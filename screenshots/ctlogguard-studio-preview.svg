  <rect x="50" y="255" width="250" height="50" rx="6" fill="#0d1124" stroke="#212a52"/>
  <text x="64" y="273" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">DOMAIN &amp; VALIDITY</text>
  <text x="64" y="293" fill="#ffffff" font-family="monospace" font-size="11">api.apexfinbank.com (365d)</text>

  <rect x="315" y="255" width="250" height="50" rx="6" fill="#0d1124" stroke="#212a52"/>
  <text x="329" y="273" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">QUALIFIED SCT COUNT</text>
  <text x="329" y="293" fill="#10b981" font-family="monospace" font-size="11">3 / 3 Required (100%)</text>

  <rect x="50" y="315" width="250" height="50" rx="6" fill="#0d1124" stroke="#212a52"/>
  <text x="64" y="333" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">OPERATOR DIVERSITY</text>
  <text x="64" y="353" fill="#38bdf8" font-family="monospace" font-size="11">Google + Non-Google (3)</text>

  <rect x="315" y="315" width="250" height="50" rx="6" fill="#0d1124" stroke="#212a52"/>
  <text x="329" y="333" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">DNS CAA &amp; WILDCARD GUARD</text>
  <text x="329" y="353" fill="#34d399" font-family="monospace" font-size="11">Active (issuewild ";")</text>

  <rect x="50" y="375" width="515" height="74" rx="6" fill="#080b1a" stroke="#212a52"/>
  <text x="66" y="398" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">REAL-TIME CT STREAM INGESTION &amp; HYGIENE:</text>
  <text x="66" y="418" fill="#34d399" font-family="monospace" font-size="11">&#10003; 3 Qualified SCTs Active &bull; Zero Disqualified Logs &bull; Valid Signatures</text>
  <text x="66" y="436" fill="#38bdf8" font-family="monospace" font-size="11">&#10003; Real-Time CT Monitor Active &bull; Rogue Wildcard Alerting Armed</text>

