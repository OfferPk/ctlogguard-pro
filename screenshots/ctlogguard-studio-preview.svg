  <text x="635" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">2. 10-Point Zero-Trust CT Scorecard</text>

  <rect x="635" y="152" width="515" height="74" rx="8" fill="#0d1124" stroke="#212a52"/>
  <circle cx="678" cy="189" r="28" fill="url(#gradScoreCt)"/>
  <text x="678" y="196" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="middle">A+</text>
  <text x="722" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">100 / 100 Points</text>
  <text x="722" y="200" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12">Chrome &amp; Apple CT Verified &bull; 10 Passed &bull; 0 Outage Risks</text>

