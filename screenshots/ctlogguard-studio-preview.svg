<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgCt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060813"/>
      <stop offset="50%" stop-color="#0d1124"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="gradLogoCt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradScoreCt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
